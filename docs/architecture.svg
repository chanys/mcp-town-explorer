<svg xmlns="http://www.w3.org/2000/svg" width="900" height="636" viewBox="0 0 900 636" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <!-- own background card, so it reads on light or dark backgrounds -->
  <rect x="1" y="1" width="898" height="634" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- user -->
  <rect x="385" y="26" width="130" height="48" rx="24" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="450" y="58" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">user</text>
  <line x1="450" y1="74" x2="450" y2="112" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- HOST -->
  <rect x="70" y="114" width="760" height="192" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="100" y="153" font-size="22" font-weight="700" fill="#1d4ed8">HOST</text>
  <text x="182" y="153" font-size="16" fill="#475569">v1_cli/host.py  or  v2_llm/host.py</text>

  <rect x="100" y="170" width="660" height="54" rx="11" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="122" y="204" font-size="18" fill="#0f172a"><tspan font-weight="600">V2 only:</tspan> the LLM proposes tool calls</text>

  <rect x="100" y="234" width="660" height="54" rx="11" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="122" y="268" font-size="18" fill="#0f172a"><tspan font-weight="600">MCP CLIENT = ClientSession</tspan>  (from the SDK, not hand-written)</text>

  <!-- arrow: transport -->
  <line x1="450" y1="306" x2="450" y2="380" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="476" y="341" font-size="15" font-weight="600" fill="#334155">JSON-RPC over stdio</text>
  <text x="476" y="363" font-size="14" fill="#64748b">server runs as a local subprocess</text>

  <!-- SERVER -->
  <rect x="140" y="382" width="620" height="142" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="170" y="422" font-size="22" font-weight="700" fill="#047857">SERVER</text>
  <text x="270" y="422" font-size="16" fill="#475569">server/server.py  (FastMCP)</text>
  <text x="170" y="462" font-size="17" fill="#0f172a"><tspan font-weight="600">tools:</tspan>  get_housing · get_distance · get_schools · get_safety</text>
  <text x="170" y="497" font-size="18" fill="#0f172a"><tspan font-weight="600">resource:</tspan>  town://{town}</text>

  <!-- arrow: data -->
  <line x1="450" y1="524" x2="450" y2="566" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- data -->
  <rect x="250" y="568" width="400" height="50" rx="11" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="450" y="600" text-anchor="middle" font-size="18" fill="#0f172a"><tspan font-weight="600">data/towns.csv</tspan>  ·  read once at startup</text>
</svg>
